<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Yukti">
  <title>Yukti</title>
  <!--
    The voussoir keystone, from the design system's brand/favicon.svg.

    That source file paints its paths via `class="m"` and defines no fill,
    relying on a stylesheet that does not exist in a favicon context — dropped
    in as-is it renders black or not at all. The copper is stated explicitly
    here instead.

    Copper rather than charcoal because the mark must hold on both light and
    dark browser chrome; charcoal disappears on a dark tab strip.
  -->
  <path fill="#B5642F" d="M4.2 15.9L10.6 17.0L12.5 25.1L6.4 25.1Z"/>
  <path fill="#B5642F" d="M27.8 15.9L21.4 17.0L19.5 25.1L25.6 25.1Z"/>
  <path fill="#B5642F" d="M13 7.4L19 7.4L21.2 16.6L10.8 16.6Z"/>
</svg>
